<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>frog — Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ground: #10160f;
      --surface: #1a2318;
      --hairline: #2a3524;
      --ink: #eef2e6;
      --muted: #7c8a72;
      --muted-2: #55604c;
      --accent: #9ee85a;
      --accent-2: #e8b64a;
      --water: #5fc9d1;
    }

    body {
      background: var(--ground);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--ink);
    }

    .label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted-2);
    }

    /* Device frame around the 480×320 screen */
    .device {
      background: var(--surface);
      border: 2px solid var(--hairline);
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(158, 232, 90, 0.08), 0 0 0 1px #0d120c;
      overflow: hidden;
      width: 480px;
      height: 320px;
      flex-shrink: 0;
    }

    .device iframe {
      width: 480px;
      height: 320px;
      border: none;
      display: block;
    }

    /* Demo controls */
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .ctrl-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-right: 4px;
    }

    .btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--hairline);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: #212c1d; border-color: var(--muted-2); }
    .btn.idle      { border-color: var(--hairline); color: var(--muted); }
    .btn.listening { border-color: rgba(158,232,90,0.4); color: var(--accent); }
    .btn.thinking  { border-color: rgba(232,182,74,0.4); color: var(--accent-2); }
    .btn.speaking  { border-color: rgba(95,201,209,0.4); color: var(--water); }

    .btn.idle:hover      { background: #212c1d; }
    .btn.listening:hover { background: rgba(158,232,90,0.12); }
    .btn.thinking:hover  { background: rgba(232,182,74,0.12); }
    .btn.speaking:hover  { background: rgba(95,201,209,0.12); }

    .dims {
      font-size: 10px;
      color: var(--muted-2);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="label">frog · display preview</div>

  <div class="device">
    <iframe id="screen" src="/screen.html?demo=1"></iframe>
  </div>

  <div class="dims">480 × 320 px — GeeekPi 3.5" touchscreen</div>

  <div class="controls">
    <span class="ctrl-label">Demo</span>
    <button class="btn idle"      onclick="send('idle')">Idle</button>
    <button class="btn listening" onclick="send('listening')">Listening</button>
    <button class="btn thinking"  onclick="send('thinking')">Thinking</button>
    <button class="btn speaking"  onclick="send('speaking')">Speaking</button>
  </div>

  <script>
    const DEMO_TEXTS = {
      thinking:  { userText: "What's the weather like in Draper?" },
      speaking:  { userText: "What's the weather like in Draper?",
                   aiText:   "It's currently 72 degrees in Draper with clear skies. Great day to be outside." },
      idle:      { aiText:   "It's currently 72 degrees in Draper with clear skies." },
    };

    function send(state) {
      const frame = document.getElementById('screen');
      frame.contentWindow.postMessage({ type: 'demo-state', state, ...(DEMO_TEXTS[state] || {}) }, '*');
    }
  </script>
</body>
</html>
